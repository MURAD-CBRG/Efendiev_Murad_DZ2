services:
  postgres:
    image: postgres:18-alpine
    container_name: efendiev_murad_dz_1
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=ru_RU.UTF-8 --auth-host=scram-sha-256 --auth-local=scram-sha-256"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    command: >
      postgres
      -c password_encryption=scram-sha-256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  heartbeat:
    build: .
    image: efendiev_murad_dz_2:latest
    container_name: efendiev_murad_dz_2_app
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - heartbeat_logs:/var/log/heartbeat

volumes:
  pgdata:
  heartbeat_logs: